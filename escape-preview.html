<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Switch · 탈출 업다운</title>
  <link rel="stylesheet" href="styles.css?v=20261018m" />
  <style>
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .form-grid .wide { grid-column: 1 / -1; }
    .out-buy { color: var(--blue); }
    .out-sell { color: var(--red); }
    .price-xl { font-size: 28px; font-weight: 800; letter-spacing: -0.04em; }
    .muted { color: var(--muted); font-size: 12px; }
    .ladder-mini td, .ladder-mini th { font-size: 12px; }
    .start-card { padding: 0; }
    .start-wrap { padding: 0 16px 14px; }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="mark">E</div>
        <div>
          <h1>탈출 업다운</h1>
        </div>
      </div>
      <a class="btn ghost top-escape" href="index.html">돌아가기</a>
    </header>

    <section class="page active" style="display:block">
      <article class="card start-card">
        <button type="button" class="rank-toggle" id="btn-start" aria-expanded="true">
          <span>시작 상태</span>
          <span class="rank-arrow" aria-hidden="true">▲</span>
        </button>
        <div id="start-wrap" class="start-wrap">
          <div class="form-grid">
            <div class="field"><label>시작일</label><input id="p-date" type="date" value="2026-10-16" /></div>
            <div class="field"><label>종목</label><input id="p-symbol" value="SOXL" /></div>
            <div class="field"><label>이관 수량</label><input id="p-qty" type="number" step="1" value="557" /></div>
            <div class="field"><label>이관 평단</label><input id="p-avg" type="number" step="0.0001" value="130.86" /></div>
            <div class="field wide"><label>이관 금액</label><input id="p-cost" type="number" step="0.01" value="72889.02" /></div>
            <div class="field"><label>기존 원금</label><input id="p-old" type="number" step="0.01" value="73000" /></div>
            <div class="field"><label>증액</label><input id="p-add" type="number" step="0.01" value="73000" /></div>
            <div class="field"><label>포트 분할</label><input id="p-split" type="number" step="1" value="15" /></div>
            <div class="field"><label>시작 포트</label><input id="p-port" type="number" step="1" value="15" /></div>
            <div class="field"><label>종가</label><input id="p-close" type="number" step="0.01" value="93.67" /></div>
            <div class="field"><label>직전 체결가</label><input id="p-last" type="number" step="0.01" value="93.67" /></div>
            <div class="field"><label>계단 수</label><input id="p-steps" type="number" step="1" value="10" /></div>
            <div class="field"><label>계단 주수</label><input id="p-stepq" type="number" step="1" value="1" /></div>
          </div>
        </div>
      </article>

      <div class="desktop-grid">
        <article class="card">
          <h2>매수 <span class="pill" id="buy-pill">LOC</span></h2>
          <div class="k">지정가</div>
          <div class="price-xl out-buy" id="o-buy">—</div>
          <div class="muted" id="o-buy-gap"></div>
          <div class="row"><span class="k">1회 수량</span><span class="v" id="o-buy-qty">—</span></div>
          <div class="row"><span class="k">다음 포트</span><span class="v" id="o-buy-port">—</span></div>
          <div class="row"><span class="k">체결 조건</span><span class="v" id="o-buy-if">—</span></div>
        </article>
        <article class="card">
          <h2>매도 <span class="pill sell">LOC</span></h2>
          <div class="k">지정가</div>
          <div class="price-xl out-sell" id="o-sell">—</div>
          <div class="muted" id="o-sell-gap"></div>
          <div class="row"><span class="k">수량</span><span class="v" id="o-sell-qty">—</span></div>
          <div class="row"><span class="k">매도 후 포트</span><span class="v" id="o-sell-port">—</span></div>
          <div class="row"><span class="k">체결 조건</span><span class="v" id="o-sell-if">—</span></div>
        </article>
      </div>

      <article class="card">
        <h2>서식이 오늘 내는 신호</h2>
        <p id="o-signal" style="margin:0;font-weight:700"></p>
        <p class="note" id="o-signal-note"></p>
      </article>

      <article class="card">
        <h2>시드 · 평단</h2>
        <div class="row"><span class="k">총원금</span><span class="v" id="o-cap">—</span></div>
        <div class="row"><span class="k">1회 매수금</span><span class="v" id="o-shot">—</span></div>
        <div class="row"><span class="k">사용 시드</span><span class="v" id="o-used">—</span></div>
        <div class="row"><span class="k">잔여 시드</span><span class="v" id="o-left">—</span></div>
        <div class="row"><span class="k">남은 매수 횟수</span><span class="v" id="o-leftn">—</span></div>
        <div class="row"><span class="k">LP</span><span class="v" id="o-lp">—</span></div>
        <div class="row"><span class="k">평가액 / 평가</span><span class="v" id="o-eval">—</span></div>
        <div class="row"><span class="k">본전까지 종가</span><span class="v" id="o-be">—</span></div>
      </article>

      <article class="card">
        <h2>매수 계단</h2>
        <div class="grid-wrap">
          <table class="sheet ladder-mini">
            <thead><tr><th>#</th><th>단가</th><th>수량</th><th>누적</th><th>하락률</th></tr></thead>
            <tbody id="ladder-body"></tbody>
          </table>
        </div>
        <p class="note">수량은 내림. 매수 단가 C19 기준으로 1회 매수금을 나눕니다.</p>
      </article>
    </section>
  </div>
  <script>
    function n(id) { return Number(document.getElementById(id).value); }
    function round(x, d) {
      var m = Math.pow(10, d == null ? 2 : d);
      return Math.round((Number(x) + Number.EPSILON) * m) / m;
    }
    function down(x) { return Math.floor(Number(x) + 1e-12); }
    function down2(x) {
      var v = Number(x);
      var sign = v < 0 ? -1 : 1;
      return (sign * Math.floor(Math.abs(v) * 100 + 1e-10)) / 100;
    }
    function money(x, d) {
      if (x === "" || x == null || !isFinite(x)) return "—";
      return Number(x).toLocaleString("en-US", {
        minimumFractionDigits: d == null ? 2 : d,
        maximumFractionDigits: d == null ? 2 : d,
      });
    }
    function pct(x) {
      if (!isFinite(x)) return "—";
      return (x >= 0 ? "+" : "") + (x * 100).toFixed(2) + "%";
    }

    var linking = false;

    function switchBuy(port, split, lp) {
      if (!port) return round(lp * 1.1, 2);
      return round(lp * (1 - 0.002 * (20 / split) * port), 2);
    }
    function switchSell(qty, lp) {
      return qty ? lp : "";
    }

    function render() {
      var qty = n("p-qty");
      var avg = n("p-avg");
      var cost = n("p-cost");
      var oldC = n("p-old");
      var add = n("p-add");
      var split = n("p-split") || 15;
      var port = n("p-port");
      var closePx = n("p-close");
      var lastPx = n("p-last");
      var steps = n("p-steps");
      var stepq = n("p-stepq");
      var cap = oldC + add;
      var shot = split ? round(cap / split, 2) : 0;
      var lp = lastPx || closePx;
      var buy = switchBuy(port, split, lp);
      var sell = switchSell(qty, lp);
      var buyQty = buy ? down(shot / buy) : 0;
      var sellQty = port ? down(qty / port) : 0;
      var used = cost;
      var left = cap - used;
      var leftN = shot ? down(left / shot) : 0;
      var evalAmt = qty * closePx;
      var evalPct = cost ? evalAmt / cost - 1 : 0;
      var be = qty ? cost / qty : 0;

      document.getElementById("o-buy").textContent = money(buy);
      document.getElementById("o-sell").textContent = sell === "" ? "—" : money(sell);
      document.getElementById("o-buy-qty").textContent = buyQty + "주";
      document.getElementById("o-sell-qty").textContent = sellQty ? sellQty + "주" : "—";
      document.getElementById("o-buy-port").textContent = port ? "포트" + (port + 1) : "포트1";
      document.getElementById("o-sell-port").textContent = port ? "포트" + (port - 1) : "—";
      document.getElementById("o-buy-gap").textContent = lp ? "LP 대비 " + pct(buy / lp - 1) : "";
      document.getElementById("o-sell-gap").textContent = sell && lp ? "LP 대비 " + pct(sell / lp - 1) : "";
      document.getElementById("o-buy-if").textContent = "종가 ≤ " + money(buy);
      document.getElementById("o-sell-if").textContent = sell === "" ? "보유 0" : "종가 ≥ " + money(sell);

      var willBuy = closePx <= buy;
      var willSell = sell !== "" && closePx >= sell;
      var sig = document.getElementById("o-signal");
      var note = document.getElementById("o-signal-note");
      if (willBuy && !willSell) {
        sig.textContent = "매수";
        sig.style.color = "#2563eb";
        note.textContent = "종가가 매수 지정가 이하입니다.";
      } else if (willSell && !willBuy) {
        sig.textContent = "매도";
        sig.style.color = "#ef4444";
        note.textContent = "종가가 매도 지정가(LP) 이상입니다.";
      } else if (!willBuy && !willSell) {
        sig.textContent = "없음 (밴드 밖)";
        sig.style.color = "#6b7280";
        note.textContent = "종가가 매수 단가와 LP 사이에 있습니다.";
      } else {
        sig.textContent = "매수·매도 둘 다";
        sig.style.color = "#111827";
        note.textContent = "같은 종가에서 두 조건이 겹칩니다.";
      }

      document.getElementById("o-cap").textContent = money(cap);
      document.getElementById("o-shot").textContent = money(shot);
      document.getElementById("o-used").textContent = money(used);
      document.getElementById("o-left").textContent = money(left);
      document.getElementById("o-leftn").textContent = leftN + "회";
      document.getElementById("o-lp").textContent = money(lp) + " · 직전 체결";
      document.getElementById("o-eval").textContent = money(evalAmt) + " · " + pct(evalPct);
      document.getElementById("o-be").textContent = money(be) + " (" + pct(be / closePx - 1) + ")";

      var rows = [];
      rows.push({ i: 0, px: buy, q: buyQty, cum: buyQty });
      var cum = buyQty;
      var i;
      for (i = 1; i <= steps && stepq; i++) {
        cum += stepq;
        rows.push({ i: i, px: down2(shot / cum), q: stepq, cum: cum });
      }
      document.getElementById("ladder-body").innerHTML = rows
        .map(function (r) {
          return (
            "<tr><td>" +
            (r.i === 0 ? "매수" : r.i) +
            "</td><td class='buy'>" +
            money(r.px) +
            "</td><td>" +
            r.q +
            "</td><td>" +
            r.cum +
            "</td><td>" +
            pct(r.px / buy - 1) +
            "</td></tr>"
          );
        })
        .join("");
    }

    document.getElementById("btn-start").onclick = function () {
      var open = this.getAttribute("aria-expanded") !== "true";
      this.setAttribute("aria-expanded", open ? "true" : "false");
      document.getElementById("start-wrap").classList.toggle("hidden", !open);
      this.querySelector(".rank-arrow").textContent = open ? "▲" : "▼";
    };

    document.getElementById("p-qty").addEventListener("input", function () {
      if (linking) return;
      var q = n("p-qty");
      var a = n("p-avg");
      if (q && a) document.getElementById("p-cost").value = round(q * a, 2);
      render();
    });
    document.getElementById("p-avg").addEventListener("input", function () {
      if (linking) return;
      var q = n("p-qty");
      var a = n("p-avg");
      if (q && a) document.getElementById("p-cost").value = round(q * a, 2);
      render();
    });
    document.querySelectorAll("input").forEach(function (el) {
      el.addEventListener("input", function () {
        if (linking) return;
        render();
      });
    });

    render();
  </script>
</body>
</html>
