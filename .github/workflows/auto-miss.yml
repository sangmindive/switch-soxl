name: Auto trade miss alert

on:
  schedule:
    # 19:25–00:45 KST, weekdays. One run is enough; later runs see missSent and stop.
    - cron: "25,40,55 10 * * 1-5"
    - cron: "*/15 11-15 * * 1-5"
  workflow_dispatch:

jobs:
  miss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Alert if 19:05 auto trade did not start
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node auto-miss-gist.js
